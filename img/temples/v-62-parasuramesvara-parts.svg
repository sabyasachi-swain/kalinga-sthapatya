<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outline { stroke: currentColor; stroke-width: 3; fill: #FBF7F0; stroke-linejoin: round; }
    .detail { stroke: currentColor; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Ground -->
  <line x1="50" y1="980" x2="950" y2="980" stroke="currentColor" stroke-width="3"/>

  <!-- Jagamohana -->
  <g id="jagamohana">
    <rect x="200" y="650" width="400" height="330" class="outline"/>
    <!-- lower roof -->
    <polygon points="180,650 620,650 580,500 220,500" class="outline"/>
    <!-- clerestory -->
    <rect x="220" y="470" width="360" height="30" class="outline"/>
    <!-- upper roof -->
    <polygon points="200,470 600,470 550,380 250,380" class="outline"/>
    <ellipse cx="400" cy="370" rx="15" ry="10" class="outline"/>
    <polygon points="390,370 410,370 400,340" class="outline"/>
    
    <!-- Jagamohana details -->
    <line x1="200" y1="900" x2="600" y2="900" class="detail"/>
    <line x1="200" y1="850" x2="600" y2="850" class="detail"/>
    <rect x="250" y="700" width="100" height="150" class="detail"/>
    <rect x="450" y="700" width="100" height="150" class="detail"/>
    <!-- roof steps details -->
    <line x1="195" y1="590" x2="605" y2="590" class="detail"/>
    <line x1="210" y1="540" x2="590" y2="540" class="detail"/>
    <line x1="215" y1="440" x2="585" y2="440" class="detail"/>
    <line x1="235" y1="410" x2="565" y2="410" class="detail"/>
  </g>

  <!-- Bada -->
  <g id="bada">
    <rect x="600" y="600" width="250" height="380" class="outline"/>
    <line x1="600" y1="900" x2="850" y2="900" class="detail"/>
    <line x1="600" y1="850" x2="850" y2="850" class="detail"/>
    <rect x="680" y="700" width="90" height="150" class="detail"/>
  </g>

  <!-- Gandi -->
  <g id="gandi">
    <path d="M 600 600 C 600 400 650 200 670 150 L 780 150 C 800 200 850 400 850 600 Z" class="outline"/>
    <!-- Gandi details (horizontal divisions) -->
    <path d="M 602 550 C 650 545 800 545 848 550" class="detail"/>
    <path d="M 605 500 C 650 495 800 495 845 500" class="detail"/>
    <path d="M 610 450 C 650 445 800 445 840 450" class="detail"/>
    <path d="M 618 400 C 650 395 800 395 832 400" class="detail"/>
    <path d="M 627 350 C 650 345 800 345 823 350" class="detail"/>
    <path d="M 638 300 C 650 295 800 295 812 300" class="detail"/>
    <path d="M 648 250 C 670 245 780 245 802 250" class="detail"/>
    <path d="M 660 200 C 680 195 770 195 790 200" class="detail"/>
  </g>

  <!-- Mastaka -->
  <g id="mastaka">
    <rect x="690" y="130" width="70" height="20" class="outline"/>
    <ellipse cx="725" cy="110" rx="60" ry="20" class="outline"/>
    <path d="M 695 90 C 700 70 750 70 755 90 Z" class="outline"/>
    <circle cx="725" cy="55" r="15" class="outline"/>
    <polygon points="720,40 730,40 725,10" class="outline"/>
    <!-- Rib details on amalaka -->
    <path d="M 725 90 L 725 130" class="detail"/>
    <path d="M 705 92 Q 700 110 705 128" class="detail"/>
    <path d="M 745 92 Q 750 110 745 128" class="detail"/>
    <path d="M 685 96 Q 675 110 685 124" class="detail"/>
    <path d="M 765 96 Q 775 110 765 124" class="detail"/>
  </g>
</svg>
