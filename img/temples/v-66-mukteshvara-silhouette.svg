    <!-- Gandi (Rekha Deul) -->
    <path d="M 600 600 L 610 600 C 610 350 670 200 680 150 L 760 150 C 770 200 830 350 830 600 L 840 600 Z"/>
    
    <!-- Mastaka (Tower Crown) -->
    <!-- Beki -->
    <rect x="700" y="130" width="40" height="20"/>
    <!-- Amalaka -->
    <ellipse cx="720" cy="110" rx="60" ry="20"/>
    <!-- Khapuri & Kalasha -->
    <path d="M 690 90 C 700 60 740 60 750 90 Z"/>
