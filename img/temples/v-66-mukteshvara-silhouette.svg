<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <g id="structure" fill="currentColor">
    <!-- Base / Bada -->
    <rect x="250" y="650" width="350" height="350"/>
    <rect x="600" y="600" width="220" height="400"/>
    
    <!-- Jagamohana (Pidha roof) -->
    <!-- Lower tier -->
    <polygon points="230,650 620,650 580,550 270,550"/>
    <!-- Recess -->
    <rect x="270" y="520" width="310" height="30"/>
    <!-- Upper tier -->
