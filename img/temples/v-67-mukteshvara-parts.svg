<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outline { stroke: currentColor; stroke-width: 3; fill: #FBF7F0; stroke-linejoin: round; }
    .detail { stroke: currentColor; stroke-width: 1.5; fill: none; }
  </style>

  <!-- Ground -->
  <line x1="20" y1="980" x2="980" y2="980" stroke="currentColor" stroke-width="3"/>

  <!-- Torana (Archway) -->
  <g id="torana">
    <!-- Left pillar -->
    <rect x="80" y="600" width="50" height="380" class="outline"/>
    <!-- Right pillar -->
    <rect x="270" y="600" width="50" height="380" class="outline"/>
    <!-- Arch -->
    <path d="M 80 600 C 80 400 320 400 320 600" class="outline"/>
    <path d="M 130 600 C 130 460 270 460 270 600" class="outline"/>
    <!-- Details -->
    <line x1="80" y1="850" x2="130" y2="850" class="detail"/>
    <line x1="80" y1="800" x2="130" y2="800" class="detail"/>
    <line x1="270" y1="850" x2="320" y2="850" class="detail"/>
    <line x1="270" y1="800" x2="320" y2="800" class="detail"/>
    <!-- Top finials of arch -->
    <ellipse cx="105" cy="480" rx="20" ry="10" class="detail"/>
    <ellipse cx="295" cy="480" rx="20" ry="10" class="detail"/>
    <circle cx="200" cy="430" r="15" class="detail"/>
  </g>

  <!-- Jagamohana -->
  <g id="jagamohana">
    <rect x="250" y="650" width="350" height="330" class="outline"/>
    <polygon points="230,650 620,650 580,550 270,550" class="outline"/>
    <rect x="270" y="520" width="310" height="30" class="outline"/>
    <polygon points="250,520 600,520 540,430 310,430" class="outline"/>
    <path d="M 425 430 Q 425 390 410 390 L 440 390 Q 425 390 425 430 Z" class="outline"/>
    <circle cx="425" cy="375" r="15" class="outline"/>
    <polygon points="420,360 430,360 425,340" class="outline"/>
    <!-- details -->
    <line x1="250" y1="900" x2="600" y2="900" class="detail"/>
    <line x1="250" y1="850" x2="600" y2="850" class="detail"/>
    <line x1="240" y1="600" x2="610" y2="600" class="detail"/>
    <line x1="280" y1="475" x2="570" y2="475" class="detail"/>
  </g>

  <!-- Bada -->
  <g id="bada">
    <rect x="600" y="600" width="220" height="380" class="outline"/>
    <line x1="600" y1="900" x2="820" y2="900" class="detail"/>
    <line x1="600" y1="850" x2="820" y2="850" class="detail"/>
    <rect x="670" y="700" width="80" height="150" class="detail"/>
  </g>

  <!-- Gandi -->
  <g id="gandi">
    <path d="M 600 600 C 600 350 670 200 680 150 L 760 150 C 770 200 840 350 840 600 Z" class="outline"/>
    <path d="M 602 550 C 650 545 790 545 838 550" class="detail"/>
    <path d="M 605 500 C 650 495 790 495 835 500" class="detail"/>
    <path d="M 612 400 C 650 395 790 395 828 400" class="detail"/>
    <path d="M 630 300 C 650 295 790 295 810 300" class="detail"/>
    <path d="M 655 200 C 680 195 760 195 785 200" class="detail"/>
  </g>

  <!-- Mastaka -->
  <g id="mastaka">
    <rect x="700" y="130" width="40" height="20" class="outline"/>
    <ellipse cx="720" cy="110" rx="60" ry="20" class="outline"/>
    <path d="M 690 90 C 700 60 740 60 750 90 Z" class="outline"/>
    <circle cx="720" cy="45" r="15" class="outline"/>
    <polygon points="715,30 725,30 720,0" class="outline"/>
    <!-- Ribs -->
    <path d="M 720 90 L 720 130" class="detail"/>
    <path d="M 700 92 Q 695 110 700 128" class="detail"/>
    <path d="M 740 92 Q 745 110 740 128" class="detail"/>
  </g>
</svg>
