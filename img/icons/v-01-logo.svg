<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <g id="logo">
    <!-- Base -->
    <rect x="18" y="50" width="28" height="8" rx="0.5" fill="currentColor"/>
    <!-- Tower body: nearly vertical sides curving inward like a sugar-loaf -->
    <path d="M20 50 C20 50, 19.5 42, 20 36 C20.5 30, 22 24, 24 20 C26 16, 28 14.5, 32 13 C36 14.5, 38 16, 40 20 C42 24, 43.5 30, 44 36 C44.5 42, 44 50, 44 50 Z" fill="currentColor"/>
    <!-- Ribbed disc (amalaka) -->
    <ellipse cx="32" cy="12" rx="9" ry="2.8" fill="currentColor"/>
    <!-- Notches on the disc to suggest ribs -->
    <rect x="24.5" y="10.5" width="0.8" height="3" rx="0.4" fill="currentColor" opacity="0"/>
    <path d="M24.2 11.5 L24.2 12.5 M27 10.2 L27 13.8 M29.5 9.8 L29.5 14.2 M32 9.6 L32 14.4 M34.5 9.8 L34.5 14.2 M37 10.2 L37 13.8 M39.8 11.5 L39.8 12.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0"/>
    <!-- Visible rib notches as small shapes -->
    <rect x="25" y="10" width="1" height="4" rx="0.5" fill="currentColor"/>
    <rect x="27.5" y="9.6" width="1" height="4.8" rx="0.5" fill="currentColor"/>
    <rect x="30" y="9.4" width="1" height="5.2" rx="0.5" fill="currentColor"/>
    <rect x="33" y="9.4" width="1" height="5.2" rx="0.5" fill="currentColor"/>
    <rect x="35.5" y="9.6" width="1" height="4.8" rx="0.5" fill="currentColor"/>
    <rect x="38" y="10" width="1" height="4" rx="0.5" fill="currentColor"/>
    <!-- Dome cap -->
    <path d="M28.5 9.2 Q28.5 7, 32 6 Q35.5 7, 35.5 9.2 Z" fill="currentColor"/>
    <!-- Pot finial (kalasa) -->
    <path d="M30.5 6 Q30.5 5, 32 4 Q33.5 5, 33.5 6 Z" fill="currentColor"/>
  </g>
</svg>
